<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Supply Chain Workbook: interactive supply chain lessons</title>
  <meta name="description" content="A living spreadsheet of supply chain lessons: bottlenecks, the bullwhip effect, the IT gap, holding costs, EOQ and why doing things right isn't the same as doing the right things.">
  <!-- Link previews for LinkedIn. Replace YOUR-USERNAME with your GitHub username. -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Supply Chain Workbook">
  <meta property="og:description" content="Interactive supply chain lessons in a living spreadsheet: bottlenecks, bullwhip, the IT gap, holding cost and more.">
  <meta property="og:image" content="https://YOUR-USERNAME.github.io/supply-chain-workbook/assets/preview.png">
  <meta property="og:url" content="https://YOUR-USERNAME.github.io/supply-chain-workbook/">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" type="image/svg+xml" href="assets/icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;800&family=JetBrains+Mono:wght@500;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <script>
    (function () {
      var t = 'light';
      try { t = localStorage.getItem('scw-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); } catch (e) {}
      document.documentElement.dataset.theme = t;
    })();
  </script>
</head>
<body>
  <div id="gate" role="dialog" aria-modal="true" aria-labelledby="gateTitle">
    <form id="gateForm" class="gate-card" autocomplete="off">
      <p class="gate-file">Supply Chain Workbook</p>
      <h1 id="gateTitle">Skill-testing question</h1>
      <p class="gate-lead">Answer one quick math question to open the workbook.</p>
      <p class="gate-q"><span id="gateExpr"></span> <span aria-hidden="true">=</span></p>
      <label class="sr-only" for="gateInput">Your answer</label>
      <input id="gateInput" class="gate-input" type="text" inputmode="numeric" pattern="-?[0-9]*" placeholder="Your answer" required>
      <p id="gateMsg" class="gate-msg" aria-live="polite"></p>
      <ol id="gateSteps" class="gate-steps" hidden></ol>
      <div class="gate-actions">
        <button type="button" id="gateHint" class="btn btn-quiet">Show the steps</button>
        <button type="button" id="gateNew" class="btn btn-quiet">New question</button>
        <button type="submit" class="btn btn-go">Open workbook</button>
      </div>
    </form>
  </div>

  <div id="app" inert>
    <header class="topbar">
      <div class="file"><span class="file-icon" aria-hidden="true"></span><span class="file-name">Supply Chain Workbook</span></div>
      <button id="themeBtn" class="btn btn-quiet theme-btn" type="button" aria-pressed="false">Dark mode</button>
    </header>
    <div class="formula" role="note" aria-label="Formula for this sheet">
      <span id="nameBox" class="namebox"></span>
      <span class="fx" aria-hidden="true">fx</span>
      <code id="formula"></code>
    </div>
    <main id="sheetArea" class="sheet-area" tabindex="-1"></main>
    <nav id="tabs" class="tabs" role="tablist" aria-label="Sheets"></nav>
  </div>

  <noscript><p class="noscript">This workbook needs JavaScript to run.</p></noscript>
  <script src="js/app.js"></script>
  <script src="js/sheets-flow.js"></script>
  <script src="js/sheets-cost.js"></script>
</body>
</html>
